<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDUSTREAMIX | B.Com Semester 6</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
background:linear-gradient(135deg,#f0f9ff,#f8fafc,#ecfdf5);
min-height:100vh;
color:#1e293b;
}
nav{
padding:18px 40px;
background:rgba(255,255,255,0.7);
backdrop-filter:blur(10px);
box-shadow:0 4px 20px rgba(0,0,0,0.05);
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
}
.logo{font-size:22px;font-weight:700;}
.container{padding:40px 20px;max-width:1200px;margin:auto;text-align:center;}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
margin-top:30px;
animation:fadeIn .4s ease-in-out;
}
.card{
padding:22px;
border-radius:20px;
background:white;
box-shadow:0 8px 25px rgba(0,0,0,0.05);
cursor:pointer;
transition:.3s;
}
.card:hover{
transform:translateY(-8px);
background:#0ea5e9;
color:white;
box-shadow:0 15px 35px rgba(14,165,233,0.3);
}
.link-btn{
display:inline-block;
padding:14px 28px;
border-radius:30px;
background:#22c55e;
color:white;
text-decoration:none;
font-weight:500;
transition:.3s;
margin:10px;
}
.link-btn:hover{
background:#16a34a;
transform:translateY(-4px);
}
.breadcrumb{margin-bottom:20px;color:#475569;font-size:14px;}
.hidden{display:none;}
footer{
margin-top:60px;
padding:25px;
background:#0f172a;
color:white;
text-align:center;
}
@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<nav>
<div class="logo">EDUSTREAMIX</div>
<div>B.Com Semester 6 Smart Learning Portal</div>
</nav>

<div class="container">

<div class="breadcrumb" id="breadcrumb">Home</div>

<div id="groups" class="grid"></div>
<div id="subjects" class="grid hidden"></div>
<div id="sections" class="grid hidden"></div>
<div id="links" class="grid hidden"></div>

</div>

<footer>
© 2026 EDUSTREAMIX | Designed for Commerce Excellence
</footer>

/* ================= UI LOGIC ================= */

const groupsDiv=document.getElementById("groups");
const subjectsDiv=document.getElementById("subjects");
const sectionsDiv=document.getElementById("sections");
const linksDiv=document.getElementById("links");
const breadcrumb=document.getElementById("breadcrumb");

function createCard(text,click){
let div=document.createElement("div");
div.className="card";
div.innerText=text;
div.onclick=click;
return div;
}

function resetViews(){
subjectsDiv.classList.add("hidden");
sectionsDiv.classList.add("hidden");
linksDiv.classList.add("hidden");
}

function showSubjects(group){
resetViews();
subjectsDiv.innerHTML="";
subjectsDiv.classList.remove("hidden");
breadcrumb.innerText="Home > "+group;
data[group].forEach(sub=>{
subjectsDiv.appendChild(createCard(sub.name,()=>showSections(group,sub)));
});
}

function showSections(group,subject){
sectionsDiv.innerHTML="";
sectionsDiv.classList.remove("hidden");
breadcrumb.innerText="Home > "+group+" > "+subject.name;
subject.channels.forEach(sec=>{
sectionsDiv.appendChild(createCard(sec.name,()=>showLinks(group,subject,sec)));
});
}

function showLinks(group,subject,section){
linksDiv.innerHTML="";
linksDiv.classList.remove("hidden");
breadcrumb.innerText="Home > "+group+" > "+subject.name+" > "+section.name;
section.links.forEach(link=>{
let a=document.createElement("a");
a.href=link;
a.target="_blank";
a.className="link-btn";
a.innerText="▶ Open Playlist";
linksDiv.appendChild(a);
});
}

for(let group in data){
groupsDiv.appendChild(createCard(group,()=>showSubjects(group)));
}

</script>

</body>
</html>
