<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.Com 6th Sem Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">B.Com 6th Sem</div>
        <div class="nav-links">
            <button onclick="switchCourse('General')" id="btn-General" class="active">General</button>
            <button onclick="switchCourse('Honors')" id="btn-Honors">Honors</button>
            <button onclick="switchCourse('Analytics')" id="btn-Analytics">Analytics</button>
            <button onclick="switchCourse('Computers')" id="btn-Computers">Computers</button>
        </div>
    </nav>

    <div class="container">
        
        <aside class="sidebar" id="subject-list">
            </aside>

        <main class="content-area">
            <h2 id="current-subject-title">Select a Subject</h2>
            <div id="units-container">
                </div>
        </main>
    </div>

    <script src="data.js"></script>

    <script>
        let currentCourse = 'General';
        
        // 1. Start the app when page loads
        window.onload = function() {
            switchCourse('General');
        };

        // 2. Switch between General, Honors, etc.
        function switchCourse(courseName) {
            currentCourse = courseName;
            
            // Update the Top Navigation Styling (Red Underline)
            document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${courseName}`);
            if(activeBtn) activeBtn.classList.add('active');

            // Load the subjects for this course
            loadSubjects(courseName);
        }

        // 3. Populate the Sidebar
        function loadSubjects(courseName) {
            const subjectList = document.getElementById('subject-list');
            subjectList.innerHTML = "<h3>Subjects</h3>"; 
            
            // Safety check: Does this course exist in data.js?
            if (!bcomData[courseName]) {
                subjectList.innerHTML += "<p style='color:gray; padding:10px;'>No data found.</p>";
                return;
            }

            const subjects = Object.keys(bcomData[courseName]);
            
            subjects.forEach((subject, index) => {
                const btn = document.createElement('button');
                btn.innerText = subject;
                btn.onclick = () => loadUnits(courseName, subject);
                
                // Automatically click the first subject so the page isn't empty
                if(index === 0) {
                    btn.click(); 
                    // Add a temporary active class to the first button
                    btn.style.color = "white";
                    btn.style.backgroundColor = "#333";
                }

                // Add click effect for sidebar buttons
                btn.addEventListener('click', function() {
                    // Reset all sidebar buttons
                    const allBtns = subjectList.querySelectorAll('button');
                    allBtns.forEach(b => {
                        b.style.color = "#b3b3b3";
                        b.style.backgroundColor = "transparent";
                    });
                    // Highlight this one
                    this.style.color = "white";
                    this.style.backgroundColor = "#333";
                });

                subjectList.appendChild(btn);
            });
        }

        // 4. Load the Videos for the chosen Subject
        function loadUnits(course, subject) {
            const container = document.getElementById('units-container');
            const title = document.getElementById('current-subject-title');
            
            title.innerText = subject;
            container.innerHTML = ""; // Clear old videos
            
            // Get the list of units (Array)
            const units = bcomData[course][subject];

            units.forEach(unitObj => {
                // If a unit has no links, skip it to keep the page clean
                if (unitObj.links.length === 0) return; 

                const unitSection = document.createElement('div');
                unitSection.className = 'unit-section';
                
                const unitTitle = document.createElement('h3');
                unitTitle.innerText = unitObj.unit;
                unitSection.appendChild(unitTitle);

                const videoGrid = document.createElement('div');
                videoGrid.className = 'video-grid';

                unitObj.links.forEach(link => {
                    const card = createVideoCard(link);
                    videoGrid.appendChild(card);
                });

                unitSection.appendChild(videoGrid);
                container.appendChild(unitSection);
            });
        }

        // 5. Create the HTML for a single Video Card
        function createVideoCard(link) {
            let videoId = "";
            let isPlaylist = false;
            let thumbnail = "";

            // Logic to find the ID and Thumbnail
            if (link.includes("list=")) {
                isPlaylist = true;
                const urlParams = new URLSearchParams(new URL(link).search);
                videoId = urlParams.get("list");
                // Generic playlist icon
                thumbnail = "https://cdn-icons-png.flaticon.com/512/566/566045.png"; 
            } else {
                // Try to find video ID from different URL formats
                if (link.includes("youtu.be/")) {
                    videoId = link.split("youtu.be/")[1].split("?")[0];
                } else if (link.includes("watch?v=")) {
                    videoId = link.split("v=")[1].split("&")[0];
                }
                // YouTube automatically provides this thumbnail image
                thumbnail = `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
            }

            const card = document.createElement('a');
            card.href = link;
            card.target = "_blank"; // Open in new tab
            card.className = 'video-card';

            const img = document.createElement('img');
            img.src = thumbnail;
            
            const info = document.createElement('div');
            info.className = 'card-info';
            // Add Icon based on type
            info.innerHTML = isPlaylist ? 
                '<i class="fas fa-list"></i> Playlist' : 
                '<i class="fas fa-play"></i> Video';

            card.appendChild(img);
            card.appendChild(info);
            return card;
        }
    </script>
</body>
</html>
