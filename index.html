<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EDUSTREAMIX | B.Com Semester 6</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#e0f2fe,#f0fdf4);
    color:#1e293b;
    text-align:center;
}

header{
    padding:30px 20px;
}

header h1{
    font-size:38px;
    margin:0;
    color:#0f172a;
    letter-spacing:2px;
}

header p{
    margin:10px 0 20px;
    font-size:15px;
    color:#475569;
}

header input{
    padding:10px;
    width:280px;
    border-radius:8px;
    border:1px solid #cbd5e1;
    outline:none;
    font-size:14px;
}

.section{
    margin-top:30px;
    display:none;
}

.card-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    margin:20px;
}

.card{
    background:white;
    padding:18px 25px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.05);
    cursor:pointer;
    min-width:220px;
    transition:0.3s;
    font-weight:500;
}

.card:hover{
    transform:translateY(-5px);
    background:#0ea5e9;
    color:white;
}

.link-card{
    display:block;
    padding:14px 25px;
    border-radius:12px;
    background:#22c55e;
    color:white;
    text-decoration:none;
    font-weight:500;
    box-shadow:0 6px 15px rgba(0,0,0,0.05);
    transition:0.3s;
}

.link-card:hover{
    background:#16a34a;
    transform:translateY(-3px);
}

.back-btn{
    margin-top:10px;
    cursor:pointer;
    font-size:14px;
    color:#0284c7;
}

footer{
    margin-top:60px;
    padding:20px;
    font-size:14px;
    background:#0f172a;
    color:white;
}
</style>
</head>

<body>

<header>
<h1>EDUSTREAMIX</h1>
<p>B.Com Semester 6 Smart Learning Portal</p>
<input type="text" id="searchBox" placeholder="Search Subject..." onkeyup="searchSubject()">
</header>

<div id="groups" class="section"></div>
<div id="subjects" class="section"></div>
<div id="sections" class="section"></div>
<div id="links" class="section"></div>

<footer>
© 2026 EDUSTREAMIX | Professional Learning Portal
</footer>

<script>

/* ---------- DATA ---------- */

const commonLanguages = [
{
name:"English",
channels:[
{name:"Part A - English by Nisa",links:["https://www.youtube.com/playlist?list=PLUJXB7al70IB4mDWQIPyriRRylnwjPU2D"]},
{name:"Part B - English by Nisa",links:["https://www.youtube.com/playlist?list=PLUJXB7al70IBdkE4oiI4d40mycUq4JnQ8"]}
]
},
{
name:"Telugu",
channels:[
{name:"Dandu Venkatramulu",links:["https://www.youtube.com/playlist?list=PLyjVm5GfnmY6UUa5iLn-GQNPkW7y1CeMh"]}
]
},
{
name:"Hindi",
channels:[
{name:"Disha Hindi Classes",links:["https://www.youtube.com/playlist?list=PLsTBUOfP6EhdnT2rEau2eaprGMdw6BZra"]}
]
},
{
name:"Sanskrit",
channels:[
{name:"My Teaching Talkies",links:["https://www.youtube.com/playlist?list=PLc1Q__0qOGAoAuv-LLipyNqpatmyE_7KJ"]}
]
}
];

const commerceCore = [
{
name:"Cost Control and Management Accounting",
channels:[
{name:"Hasham Ali Khan",links:["https://www.youtube.com/playlist?list=PLWJDzVuPkXAllmGP19jfhneNUdgOy1g2v"]}
]
},
{
name:"Theory and Practice of GST",
channels:[
{name:"Hasham Ali Khan",links:["https://www.youtube.com/playlist?list=PLWJDzVuPkXAkNpdAIqufc2JxDoxjENrsj"]}
]
},
{
name:"Research Methodology & Project",
channels:[
{name:"Devika’s Commerce",links:["https://www.youtube.com/playlist?list=PLLhSIFfDZcUWRlgiXMkd1rNeLSz1You4O"]}
]
}
];

const data = {

"B.Com General - Semester 6":[
...commonLanguages,
...commerceCore
],

"B.Com Honors - Semester 6":[
...commonLanguages,
{name:"International Finance",
channels:[
{name:"Hasham Ali Khan",links:["https://www.youtube.com/playlist?list=PLWJDzVuPkXAnNpRjN6InK65R7ndvpYZUf"]}
]
},
...commerceCore
],

"B.Com Computer Applications - Semester 6":[
...commonLanguages,
...commerceCore,
{name:"Cybersecurity",
channels:[
{name:"Whole Subject",links:["https://www.youtube.com/playlist?list=PLtfg0YD2YYUQMZp4bRkeZI0JXWHGqh8vo"]}
]
}
],

"B.Com Business Analytics - Semester 6":[
...commonLanguages,
...commerceCore,
{name:"Business Application of Emerging Technologies",
channels:[
{name:"(Add Playlist Here)",links:["#"]}
]
}
]

};

/* ---------- LOGIC ---------- */

const groupsDiv = document.getElementById("groups");
const subjectsDiv = document.getElementById("subjects");
const sectionsDiv = document.getElementById("sections");
const linksDiv = document.getElementById("links");

function hideAll(){
subjectsDiv.style.display="none";
sectionsDiv.style.display="none";
linksDiv.style.display="none";
}

function createCard(text, clickFn){
let btn=document.createElement("div");
btn.className="card";
btn.innerText=text;
btn.onclick=clickFn;
return btn;
}

function showSubjects(group){
hideAll();
subjectsDiv.innerHTML="";
subjectsDiv.style.display="block";

data[group].forEach(sub=>{
subjectsDiv.appendChild(createCard(sub.name,()=>showSections(sub)));
});
}

function showSections(subject){
sectionsDiv.innerHTML="";
sectionsDiv.style.display="block";

subject.channels.forEach(sec=>{
sectionsDiv.appendChild(createCard(sec.name,()=>showLinks(sec)));
});
}

function showLinks(section){
linksDiv.innerHTML="";
linksDiv.style.display="block";

section.links.forEach(link=>{
let a=document.createElement("a");
a.href=link;
a.target="_blank";
a.className="link-card";
a.innerText="▶ Open YouTube Playlist";
linksDiv.appendChild(a);
});
}

function searchSubject(){
let input=document.getElementById("searchBox").value.toLowerCase();
subjectsDiv.querySelectorAll(".card").forEach(card=>{
card.style.display=card.innerText.toLowerCase().includes(input)?"block":"none";
});
}

window.onload=function(){
groupsDiv.style.display="block";
for(let group in data){
groupsDiv.appendChild(createCard(group,()=>showSubjects(group)));
}
}

</script>

</body>
</html>
