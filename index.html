<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EDUSTREAMIX | B.Com Semester 6</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>EDUSTREAMIX</h1>
<p>B.Com Semester 6 Learning Portal</p>
</header>

<main>

<section id="groupsSection" class="section active">
<h2>Select Your Group</h2>
<div id="groups" class="card-container"></div>
</section>

<section id="subjectsSection" class="section">
<button onclick="goBack('groups')">← Back</button>
<h2>Select Subject</h2>
<div id="subjects" class="card-container"></div>
</section>

<section id="sectionsSection" class="section">
<button onclick="goBack('subjects')">← Back</button>
<h2>Select Part</h2>
<div id="sections" class="card-container"></div>
</section>

<section id="linksSection" class="section">
<button onclick="goBack('sections')">← Back</button>
<h2>Open YouTube Playlist</h2>
<div id="links" class="card-container"></div>
</section>

</main>

<footer>
<p>© 2026 EDUSTREAMIX | Professional Learning Portal</p>
</footer>

<script src="data.js"></script>

<script>
const groupsDiv = document.getElementById("groups");
const subjectsDiv = document.getElementById("subjects");
const sectionsDiv = document.getElementById("sections");
const linksDiv = document.getElementById("links");

function showSection(id){
document.querySelectorAll(".section").forEach(sec=>sec.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function goBack(level){
if(level==="groups") showSection("groupsSection");
if(level==="subjects") showSection("subjectsSection");
if(level==="sections") showSection("sectionsSection");
}

function createCard(text, clickFn){
let card = document.createElement("div");
card.className="card";
card.innerText=text;
card.onclick=clickFn;
return card;
}

function showSubjects(group){
subjectsDiv.innerHTML="";
data[group].forEach(sub=>{
subjectsDiv.appendChild(
createCard(sub.name, ()=>showSections(sub))
);
});
showSection("subjectsSection");
}

function showSections(subject){
sectionsDiv.innerHTML="";
subject.channels.forEach(sec=>{
sectionsDiv.appendChild(
createCard(sec.name, ()=>showLinks(sec))
);
});
showSection("sectionsSection");
}

function showLinks(section){
linksDiv.innerHTML="";
section.links.forEach(link=>{
let a=document.createElement("a");
a.href=link;
a.target="_blank";
a.className="link-card";
a.innerText="▶ Open Playlist";
linksDiv.appendChild(a);
});
showSection("linksSection");
}

window.onload=function(){
for(let group in data){
groupsDiv.appendChild(
createCard(group, ()=>showSubjects(group))
);
}
}
</script>

</body>
</html>
