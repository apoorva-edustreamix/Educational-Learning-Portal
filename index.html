<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EDUSTREAMIX</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🎓 EDUSTREAMIX</h1>
<p>B.Com Semester 6 Learning Portal</p>
<input type="text" id="searchBox" placeholder="Search Subject..." onkeyup="searchSubject()">
</header>

<section class="hero">
<img src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1" class="grad-img">
<img src="https://images.unsplash.com/photo-1607013251379-e6eecfffe234" class="grad-img">
</section>

<div id="groups" class="container"></div>
<div id="subjects" class="container hidden"></div>
<div id="sections" class="container hidden"></div>
<div id="links" class="container hidden"></div>

<footer>
<p>© 2026 EDUSTREAMIX | Professional Learning Portal</p>
</footer>

<script src="data.js"></script>

<script>
const groupsDiv = document.getElementById("groups");
const subjectsDiv = document.getElementById("subjects");
const sectionsDiv = document.getElementById("sections");
const linksDiv = document.getElementById("links");

function showOnly(div){
groupsDiv.classList.add("hidden");
subjectsDiv.classList.add("hidden");
sectionsDiv.classList.add("hidden");
linksDiv.classList.add("hidden");
div.classList.remove("hidden");
}

function createCard(text, clickFn){
let btn = document.createElement("div");
btn.className = "card";
btn.innerText = text;
btn.onclick = clickFn;
return btn;
}

function showSubjects(group){
subjectsDiv.innerHTML="";
data[group].forEach(sub=>{
subjectsDiv.appendChild(
createCard(sub.name, ()=>showSections(sub))
);
});
showOnly(subjectsDiv);
}

function showSections(subject){
sectionsDiv.innerHTML="";
subject.channels.forEach(sec=>{
sectionsDiv.appendChild(
createCard(sec.name, ()=>showLinks(sec))
);
});
showOnly(sectionsDiv);
}

function showLinks(section){
linksDiv.innerHTML="";
section.links.forEach(link=>{
let a = document.createElement("a");
a.href = link;
a.target = "_blank";
a.className = "link-card";
a.innerText = "▶ Open YouTube Playlist";
linksDiv.appendChild(a);
});
showOnly(linksDiv);
}

function searchSubject(){
let input = document.getElementById("searchBox").value.toLowerCase();
subjectsDiv.querySelectorAll(".card").forEach(card=>{
card.style.display = card.innerText.toLowerCase().includes(input) ? "block":"none";
});
}

window.onload = function(){
for(let group in data){
groupsDiv.appendChild(
createCard(group, ()=>showSubjects(group))
);
}
}
</script>

</body>
</html>
