<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDUSTREAMIX | B.Com Semester 6 Learning Portal</title>

<!-- SEO -->
<meta name="description" content="EDUSTREAMIX - Professional B.Com Semester 6 Learning Portal with curated YouTube playlists.">
<meta name="keywords" content="B.Com Semester 6, EDUSTREAMIX, Commerce Study Portal, GST, Cost Accounting">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background: linear-gradient(135deg,#f0f9ff,#f8fafc,#ecfdf5);
min-height:100vh;
color:#1e293b;
}

nav{
width:100%;
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,0.7);
backdrop-filter:blur(10px);
box-shadow:0 4px 20px rgba(0,0,0,0.05);
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:22px;
font-weight:700;
letter-spacing:1px;
color:#0f172a;
}

.tagline{
font-size:13px;
color:#64748b;
}

.container{
padding:40px 20px;
max-width:1200px;
margin:auto;
text-align:center;
}

h2{
margin-bottom:25px;
font-weight:600;
}

.search-box{
margin-bottom:30px;
}

.search-box input{
padding:12px 18px;
width:280px;
border-radius:30px;
border:1px solid #cbd5e1;
outline:none;
transition:0.3s;
}

.search-box input:focus{
border-color:#0ea5e9;
box-shadow:0 0 0 3px rgba(14,165,233,0.2);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:25px;
margin-top:30px;
animation:fadeIn 0.4s ease-in-out;
}

.card{
padding:22px;
border-radius:20px;
background:rgba(255,255,255,0.75);
backdrop-filter:blur(15px);
box-shadow:0 8px 25px rgba(0,0,0,0.05);
cursor:pointer;
transition:all 0.3s ease;
font-weight:500;
}

.card:hover{
transform:translateY(-8px);
background:#0ea5e9;
color:white;
box-shadow:0 15px 35px rgba(14,165,233,0.3);
}

.link-btn{
display:inline-block;
padding:14px 28px;
border-radius:30px;
background:#22c55e;
color:white;
text-decoration:none;
font-weight:500;
transition:0.3s;
}

.link-btn:hover{
background:#16a34a;
transform:translateY(-4px);
}

.breadcrumb{
margin-bottom:20px;
font-size:14px;
color:#475569;
}

footer{
margin-top:60px;
padding:25px;
background:#0f172a;
color:white;
text-align:center;
font-size:14px;
}

.hidden{
display:none;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

@media(max-width:600px){
nav{
flex-direction:column;
gap:6px;
text-align:center;
}
}
</style>
</head>

<body>

<nav>
<div class="logo">EDUSTREAMIX</div>
<div class="tagline">Professional B.Com Semester 6 Learning Portal</div>
</nav>

<div class="container">

<div class="breadcrumb" id="breadcrumb">Home</div>

<div class="search-box">
<input type="text" id="search" placeholder="Search Subject..." onkeyup="searchSubject()">
</div>

<div id="groups" class="grid"></div>
<div id="subjects" class="grid hidden"></div>
<div id="sections" class="grid hidden"></div>
<div id="links" class="grid hidden"></div>

</div>

<footer>
© 2026 EDUSTREAMIX | Designed for Smart Commerce Students
</footer>

<script>

/* DATA */

const baseSubjects = [
{name:"English",channels:[
{name:"Part A - English by Nisa",links:["https://www.youtube.com/playlist?list=PLUJXB7al70IB4mDWQIPyriRRylnwjPU2D"]}
]},
{name:"Cost Control and Management Accounting",channels:[
{name:"Hasham Ali Khan",links:["https://www.youtube.com/playlist?list=PLWJDzVuPkXAllmGP19jfhneNUdgOy1g2v"]}
]},
{name:"Theory and Practice of GST",channels:[
{name:"Hasham Ali Khan",links:["https://www.youtube.com/playlist?list=PLWJDzVuPkXAkNpdAIqufc2JxDoxjENrsj"]}
]},
{name:"Research Methodology & Project",channels:[
{name:"Devika’s Commerce",links:["https://www.youtube.com/playlist?list=PLLhSIFfDZcUWRlgiXMkd1rNeLSz1You4O"]}
]}
];

const data={
"B.Com General - Semester 6":[...baseSubjects],
"B.Com Computer Applications - Semester 6":[
...baseSubjects,
{name:"Cybersecurity",channels:[
{name:"Whole Subject",links:["https://www.youtube.com/playlist?list=PLtfg0YD2YYUQMZp4bRkeZI0JXWHGqh8vo"]}
]}
],
"B.Com Business Analytics - Semester 6":[
...baseSubjects,
{name:"Business Application of Emerging Technologies",
channels:[{name:"(Add Playlist Here)",links:["#"]}]}
]
};

/* LOGIC */

const groupsDiv=document.getElementById("groups");
const subjectsDiv=document.getElementById("subjects");
const sectionsDiv=document.getElementById("sections");
const linksDiv=document.getElementById("links");
const breadcrumb=document.getElementById("breadcrumb");

function createCard(text,click){
let div=document.createElement("div");
div.className="card";
div.innerText=text;
div.onclick=click;
return div;
}

function resetViews(){
subjectsDiv.classList.add("hidden");
sectionsDiv.classList.add("hidden");
linksDiv.classList.add("hidden");
}

function showSubjects(group){
resetViews();
subjectsDiv.innerHTML="";
subjectsDiv.classList.remove("hidden");
breadcrumb.innerText="Home > "+group;

data[group].forEach(sub=>{
subjectsDiv.appendChild(createCard(sub.name,()=>showSections(group,sub)));
});
}

function showSections(group,subject){
sectionsDiv.innerHTML="";
sectionsDiv.classList.remove("hidden");
breadcrumb.innerText="Home > "+group+" > "+subject.name;

subject.channels.forEach(sec=>{
sectionsDiv.appendChild(createCard(sec.name,()=>showLinks(group,subject,sec)));
});
}

function showLinks(group,subject,section){
linksDiv.innerHTML="";
linksDiv.classList.remove("hidden");
breadcrumb.innerText="Home > "+group+" > "+subject.name+" > "+section.name;

section.links.forEach(link=>{
let a=document.createElement("a");
a.href=link;
a.target="_blank";
a.className="link-btn";
a.innerText="▶ Open Playlist";
linksDiv.appendChild(a);
});
}

function searchSubject(){
let val=document.getElementById("search").value.toLowerCase();
subjectsDiv.querySelectorAll(".card").forEach(card=>{
card.style.display=card.innerText.toLowerCase().includes(val)?"block":"none";
});
}

for(let group in data){
groupsDiv.appendChild(createCard(group,()=>showSubjects(group)));
}

</script>

</body>
</html>
